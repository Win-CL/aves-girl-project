<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GALLERY | AVES GIRL PROJECT</title>

    <style>

        /* ================================
           基本設定
        ================================ */

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: #080a11;
            color: #f4f5f8;
            font-family: "Noto Sans JP", sans-serif;
        }

        img {
            max-width: 100%;
            display: block;
        }


        /* ========================================
           HEADER
        ======================================== */
        
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(8, 10, 18, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        
        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-family: Georgia, serif;
            font-size: 20px;
            letter-spacing: 0.18em;
            font-weight: bold;
            color: #ffffff;
            text-decoration: none;
        }
        
        nav {
            display: flex;
            gap: 28px;
            font-size: 13px;
            letter-spacing: 0.12em;
        }
        
        nav a {
            position: relative;
            color: #ffffff;
            text-decoration: none;
            opacity: 0.75;
            transition: 0.3s;
        }
        
        nav a:hover {
            opacity: 1;
        }
        
        nav a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -7px;
            width: 0;
            height: 1px;
            background: #ffffff;
            transition: width 0.3s;
        }
        
        nav a:hover::after {
            width: 100%;
        }


        /* ========================================
           MOBILE MENU BUTTON
        ======================================== */
        
        .menu-toggle {
            display: none;
            width: 36px;
            height: 36px;
            padding: 8px;
            border: none;
            background: none;
            cursor: pointer;
            flex-direction: column;
            justify-content: center;
            gap: 5px;
        }
        
        .menu-toggle span {
            display: block;
            width: 20px;
            height: 1px;
            background: #ffffff;
            margin: 0 auto;
        }


        /* ========================================
           MAIN
        ======================================== */
        
        main {
            width: 100%;
            padding: 100px 0 100px;
        }
        

        /* ========================================
           PAGE TITLE
        ======================================== */
        
        .page-title {
            text-align: center;
            margin-bottom: 65px;
        }
        
        .page-title h1 {
            margin: 0;
        
            font-family: Georgia, "Times New Roman", serif;
        
            font-size: 34px;
            letter-spacing: 5px;
            font-weight: bold;
        }
        
        .page-title p {
            margin: 14px 0 0;
        
            font-size: 11px;
            letter-spacing: 2px;
        
            color: rgba(255,255,255,0.45);
        }

        /* ================================
           GALLERY
        ================================ */

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .gallery-item {
            background: #10131f;
            border: 1px solid rgba(255,255,255,0.08);
            overflow: hidden;
            transition: transform 0.3s, border-color 0.3s;
        }

        .gallery-item:hover {
            transform: translateY(-4px);
            border-color: rgba(255,255,255,0.2);
        }

        .gallery-image {
            aspect-ratio: auto;
            overflow: hidden;
            background: #171b29;
        }

        .gallery-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .gallery-caption {
            padding: 22px 24px;
        }

        .gallery-caption .number {
            display: block;
            margin-bottom: 8px;
            color: rgba(255,255,255,0.4);
            font-size: 10px;
            letter-spacing: 0.25em;
        }

        .gallery-caption h2 {
            margin: 0;
            font-size: 18px;
            letter-spacing: 0.08em;
        }


        /* ================================
           FOOTER
        ================================ */

        footer {
            padding: 40px 30px;
            text-align: center;
            border-top: 1px solid rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.35);
            font-size: 11px;
            letter-spacing: 0.15em;
        }


        /* ========================================
           スマートフォン対応
        ======================================== */
        
        @media (max-width: 800px) {
        
            nav {
                display: none;
            }
        
            .menu-toggle {
                display: flex;
            }
        
            nav.open {
                display: flex;
        
                position: absolute;
        
                top: 100%;
                left: 0;
        
                width: 100%;
        
                flex-direction: column;
        
                gap: 0;
        
                padding: 20px 0;
        
                background: rgba(8, 10, 18, 0.97);
        
                border-bottom: 1px solid rgba(255,255,255,0.08);
            }
        
            nav.open a {
                display: block;
        
                padding: 18px 30px;
        
                text-align: center;
            }
        
            .header-inner {
                padding: 18px 20px;
            }
        
            main {
                padding: 130px 20px 90px;
            }
        
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 14px;
            }
        
            .gallery-caption {
                padding: 16px;
            }
        
            .gallery-caption h2 {
                font-size: 15px;
            }
        }

        @media (max-width: 500px) {

            .logo {
                font-size: 16px;
            }

            nav {
                gap: 10px;
            }

            .gallery-grid {
                grid-template-columns: 1fr;
            }
        }

    </style>
</head>

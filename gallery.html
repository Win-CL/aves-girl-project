<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GALLERY | AVES GIRL PROJECT</title>

    <style>

        /* ================================
           基本設定
        ================================ */

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: #080a11;
            color: #f4f5f8;
            font-family: "Noto Sans JP", sans-serif;
        }

        img {
            max-width: 100%;
            display: block;
        }


        /* ================================
           HEADER
        ================================ */

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            background: rgba(8,10,17,0.92);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.15em;
        }

        nav {
            display: flex;
            gap: 32px;
        }

        nav a {
            color: rgba(255,255,255,0.65);
            text-decoration: none;
            font-size: 12px;
            letter-spacing: 0.15em;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #ffffff;
        }


        /* ================================
           MAIN
        ================================ */

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 100px 30px 120px;
        }

        .page-title {
            margin-bottom: 70px;
        }

        .page-title .en {
            display: block;
            margin-bottom: 18px;
            color: rgba(255,255,255,0.45);
            font-size: 12px;
            letter-spacing: 0.35em;
        }

        .page-title h1 {
            margin: 0;
            font-size: clamp(42px, 8vw, 80px);
            line-height: 1;
            letter-spacing: 0.12em;
        }


        /* ================================
           GALLERY
        ================================ */

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .gallery-item {
            background: #10131f;
            border: 1px solid rgba(255,255,255,0.08);
            overflow: hidden;
            transition: transform 0.3s, border-color 0.3s;
        }

        .gallery-item:hover {
            transform: translateY(-4px);
            border-color: rgba(255,255,255,0.2);
        }

        .gallery-image {
            aspect-ratio: auto;
            overflow: hidden;
            background: #171b29;
        }

        .gallery-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .gallery-caption {
            padding: 22px 24px;
        }

        .gallery-caption .number {
            display: block;
            margin-bottom: 8px;
            color: rgba(255,255,255,0.4);
            font-size: 10px;
            letter-spacing: 0.25em;
        }

        .gallery-caption h2 {
            margin: 0;
            font-size: 18px;
            letter-spacing: 0.08em;
        }


        /* ================================
           FOOTER
        ================================ */

        footer {
            padding: 40px 30px;
            text-align: center;
            border-top: 1px solid rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.35);
            font-size: 11px;
            letter-spacing: 0.15em;
        }


        /* ================================
           スマートフォン
        ================================ */

        @media (max-width: 800px) {

            header {
                padding: 0 20px;
            }

            nav {
                gap: 14px;
            }

            nav a {
                font-size: 10px;
            }

            main {
                padding: 70px 20px 90px;
            }

            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 14px;
            }

            .gallery-caption {
                padding: 16px;
            }

            .gallery-caption h2 {
                font-size: 15px;
            }
        }

        @media (max-width: 500px) {

            .logo {
                font-size: 16px;
            }

            nav {
                gap: 10px;
            }

            .gallery-grid {
                grid-template-columns: 1fr;
            }
        }

    </style>
</head>

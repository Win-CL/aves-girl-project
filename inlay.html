<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>インレイ・グリントローヴ | AVES GIRL PROJECT</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, "Noto Sans JP", sans-serif;
    background: #080a12;
    color: #f4f5f8;
    line-height: 1.8;
}

a {
    color: inherit;
    text-decoration: none;
}

/* ========================================
   HEADER
======================================== */

header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 1000;
    background: rgba(8, 10, 18, 0.88);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255,255,255,0.08);
}

.header-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px 30px;

    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 0.2em;
}

nav {
    display: flex;
    gap: 30px;
}

nav a {
    font-size: 12px;
    letter-spacing: 0.15em;
    opacity: 0.8;
    transition: opacity 0.3s;
}

nav a:hover {
    opacity: 1;
}

/* ========================================
   MOBILE MENU BUTTON
======================================== */

.menu-toggle {
    display: none;
    width: 36px;
    height: 36px;
    padding: 0;
    border: none;
    background: transparent;
    cursor: pointer;

    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 6px;
}

.menu-toggle span {
    display: block;
    width: 22px;
    height: 1px;
    background: #f4f5f8;
}

/* ========================================
   HERO
======================================== */

.hero {
    min-height: 65vh;
    padding: 150px 30px 100px;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;
}

.hero-inner {
    max-width: 1000px;
}

.hero-number {
    font-size: 14px;
    letter-spacing: 0.3em;
    opacity: 0.5;
    margin-bottom: 25px;
}

.hero h1 {
    font-size: clamp(38px, 6.5vw, 76px);
    font-weight: 500;
    letter-spacing: 0.08em;
    line-height: 1.25;
}

.hero-name {
    margin-top: 20px;
    font-size: 14px;
    letter-spacing: 0.25em;
    opacity: 0.65;
}

/* ========================================
   CHARACTER
======================================== */

.character-detail {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 30px 120px;
}

.character-images {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
    margin-bottom: 100px;
}

.character-images img {
    display: block;
    width: 100%;
    height: auto;
    object-fit: cover;
}

/* ========================================
   INFORMATION
======================================== */

.character-info {
    max-width: 900px;
    margin: 0 auto;
}

.info-title {
    margin-bottom: 40px;

    font-size: 12px;
    letter-spacing: 0.3em;
    opacity: 0.5;
}

.info-list {
    border-top: 1px solid rgba(255,255,255,0.12);
}

.info-item {
    display: grid;
    grid-template-columns: 260px 1fr;

    padding: 25px 0;
    border-bottom: 1px solid rgba(255,255,255,0.12);
}

.info-label {
    font-size: 11px;
    letter-spacing: 0.2em;
    opacity: 0.45;
}

.info-value {
    font-size: 15px;
    letter-spacing: 0.08em;
}

/* ========================================
   FOOTER
======================================== */

footer {
    padding: 50px 30px;
    text-align: center;
    border-top: 1px solid rgba(255,255,255,0.08);
}

footer p {
    font-size: 10px;
    letter-spacing: 0.15em;
    opacity: 0.4;
}

/* ========================================
   MOBILE
======================================== */

@media (max-width: 800px) {

    nav {
        display: none;
    }

    .menu-toggle {
        display: flex;
    }

    nav.open {
        display: flex;
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;

        flex-direction: column;
        gap: 0;

        padding: 20px 0;

        background: rgba(8, 10, 18, 0.97);
        border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    nav.open a {
        display: block;
        padding: 18px 30px;
        text-align: center;
    }

    .header-inner {
        padding: 18px 20px;
    }

    .hero {
        min-height: 55vh;
        padding: 130px 20px 80px;
    }

    .hero h1 {
        font-size: clamp(32px, 8vw, 48px);
    }

    .character-detail {
        padding: 0 20px 80px;
    }

    .character-images {
        grid-template-columns: 1fr;
        gap: 20px;
        margin-bottom: 70px;
    }

    .character-info {
        width: 100%;
    }

    .info-item {
        grid-template-columns: 1fr;
        gap: 8px;
        padding: 20px 0;
    }

    .info-value {
        font-size: 14px;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-inner">

        <a href="index.html" class="logo">AVES GIRL</a>

        <button class="menu-toggle" aria-label="メニューを開く">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav>
            <a href="index.html#characters">CHARACTERS</a>
            <a href="world.html">WORLD</a>
            <a href="gallery.html">GALLERY</a>
            <a href="index.html#copyright">COPYRIGHT</a>
        </nav>

    </div>
</header>


<main>

    <section class="hero">

        <div class="hero-inner">

            <div class="hero-number">12</div>

            <h1>インレイ・グリントローヴ</h1>

            <div class="hero-name">
                INLAY GLINTROVE
            </div>

        </div>

    </section>


    <section class="character-detail">

        <div class="character-images">

            <img
                src="images/inlay.jpg"
                alt="インレイ・グリントローヴ キャラクターイラスト"
            >

            <img
                src="images/inlay_2.png"
                alt="インレイ・グリントローヴ 設定イラスト"
            >

        </div>


        <div class="character-info">

            <div class="info-title">
                CHARACTER INFORMATION
            </div>

            <div class="info-list">

                <div class="info-item">
                    <div class="info-label">ROLE</div>
                    <div class="info-value">YO-KAI / 古物蒐集家</div>
                </div>

                <div class="info-item">
                    <div class="info-label">BIRD MOTIF</div>
                    <div class="info-value">アオアズマヤドリ / Satin Bowerbird</div>
                </div>

                <div class="info-item">
                    <div class="info-label">SCIENTIFIC NAME</div>
                    <div class="info-value"><i>Ptilonorhynchus violaceus</i></div>
                </div>

                <div class="info-item">
                    <div class="info-label">FIRST PERSON</div>
                    <div class="info-value">私（わたくし）</div>
                </div>

                <div class="info-item">
                    <div class="info-label">LIKES</div>
                    <div class="info-value">藍色の物</div>
                </div>

                <div class="info-item">
                    <div class="info-label">DISLIKES</div>
                    <div class="info-value">不明</div>
                </div>

                <div class="info-item">
                    <div class="info-label">ABILITY</div>
                    <div class="info-value">不明</div>
                </div>

            </div>

        </div>

    </section>

</main>


<footer>
    <p>© AVES GIRL PROJECT</p>
</footer>


<script>
const menuToggle = document.querySelector('.menu-toggle');
const nav = document.querySelector('nav');

menuToggle.addEventListener('click', () => {
    nav.classList.toggle('open');
});
</script>

</body>
</html>
